<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NewsVerify | Fake News Detector</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>NewsVerify</h1>
    <p>AI-Powered Fake News Detection System</p>
  </header>

  <main>
    <section class="input-section">
      <h2>Check Your News</h2>
      <textarea id="newsInput" placeholder="Paste your news here..."></textarea>
      <br>
      <button id="checkBtn">Analyze</button>
    </section>

    <section class="result-section">
      <h2>Result</h2>
      <p id="result">Your result will appear here.</p>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
